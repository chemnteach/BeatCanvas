## Circular Import Fix (Latest)

**Problem:** `src/local/__init__.py` was importing heavy modules, causing circular dependencies when running scripts.

**Solution:** Lightweight init - no heavy imports.

```python
# src/local/__init__.py - BEFORE (broken)
from .image_generator import LocalImageGenerator  # Heavy!
from .video_generator import LocalVideoGenerator  # Heavy!

# src/local/__init__.py - AFTER (fixed)
"""Lightweight init - import directly from submodules."""
__all__ = ["image_generator", "video_generator", ...]
```

**Usage:** Import directly from submodules:
```python
from src.local.image_generator import LocalImageGenerator
from src.local.video_generator import LocalVideoGenerator
```

## Path Normalization (Latest Fix)

All modules now normalize paths with `os.path.abspath()` immediately:
- `image_generator.py` - `save_image()` and `generate_and_save()` methods
- `video_generator.py` - `generate_video()` normalizes input path
- `cinematic_director.py` - `run()` normalizes + verifies + 1s delay

### Verification Flow
```
1. Normalize: Path(os.path.abspath(str(path)))
2. Verify: if not path.exists(): raise FileNotFoundError
3. Delay: time.sleep(1)  # Wait for filesystem
4. Log: Emit heartbeat with absolute path + file size
```

