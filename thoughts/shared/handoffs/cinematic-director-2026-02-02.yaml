# Cinematic Director Loop - Implementation Complete

## Goal
Implement stable SVD video generation with RIFE motion smoothing and Windows handoff.

## What Was Done

### 1. OOM Prevention (video_generator.py)
- Added `get_vram_safe_decode_chunk_size()` - dynamically selects chunk size based on free VRAM
- Added OOM recovery: catches OutOfMemoryError, halves chunk size, retries
- Added `torch.cuda.empty_cache()` before heavy operations

### 2. JSON Heartbeat Monitoring (video_generator.py)
- Added `HeartbeatCallback` class for step-by-step denoising progress
- Added `_emit_heartbeat()` method for all phases (init, vram, generate, stitch, etc.)
- Emits JSON to stdout for external process monitoring

### 3. Frame Saving (video_generator.py)
- Added `save_frames()` method - saves all frames as frame_00.png, frame_01.png, etc.
- Updated `generate_video()` to return dict with {frames, frame_paths, video_path}

### 4. Reliable Stitcher (video_generator.py)
- Replaced cv2.VideoWriter with ffmpeg subprocess
- Uses libx264 with configurable CRF and preset
- Verifies output exists and has size > 0
- Reports duration and file size in heartbeat

### 5. Config Extraction
- `.env`: Machine paths (SVD_OUTPUT_DIR, WINDOWS_DOWNLOADS)
- `settings.yaml`: Logic defaults (resolution, VRAM thresholds, CRF, RIFE config)
- `env_loader.py`: Added `get_path()` function

### 6. Motion Smoother (motion_smoother.py) - NEW
- `MotionSmoother` class with RIFE interpolation via rife-ncnn-vulkan
- `extract_frames()`: ffmpeg frame extraction
- `interpolate_frames()`: RIFE with vulkan_device from config
- `stitch_to_video()`: ffmpeg H.264 encoding
- `smooth_video()`: Full pipeline with temp cleanup

### 7. Cinematic Director (cinematic_director.py) - NEW
- `CinematicDirector` orchestrates full pipeline:
  - Phase 1: SVD generate (8fps raw)
  - Phase 2: RIFE smooth (60fps interpolated)
  - Phase 3: Full Windows Handoff (timestamped folder)
- `handoff_to_windows()` creates: `synterra_YYYYMMDD_HHMMSS/`
  - `frames/` - all 25 frame PNGs (frame_00000000.png to frame_00000024.png)
  - `raw_8fps.mp4` - original SVD output
  - `cinematic_60fps.mp4` - RIFE smoothed output
- CLI with --skip-smoothing, --skip-windows-copy, --json flags

