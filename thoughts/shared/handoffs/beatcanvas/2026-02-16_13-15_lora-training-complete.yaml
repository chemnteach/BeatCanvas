questions:
  - Should we test Basic tier first or jump to Professional/Cinematic?
  - Which animation style should we test first (watercolor recommended for trop rock)?
  - Do we need to train additional scene LoRAs or use existing ones?

decisions:
  - laptop_vs_runpod: "User chose laptop-based workflow for non-photorealistic videos. Has 3 computers, so dedicating laptop to video generation is fine. Speed not a priority."
  - quality_tier: "Laptop (11GB VRAM) can handle all quality tiers including Cinematic (48 scenes). Will be slower (~60 min) but capable."
  - runpod_value: "RunPod only valuable for speed (3-4x faster) or photorealistic videos (WAN 2.6 + SkyReels). No quality benefit for non-photorealistic animation workflow."
  - training_approach: "Used manual captions instead of Florence-2 due to compatibility issues. Simple 'a photo of ohwx man/woman, portrait' worked well."

findings:
  - laptop_capability: "11GB VRAM detected (from nvidia-smi). Successfully trained 2x SDXL-based LoRAs at ~30 min each. Can handle SDXL + ControlNet for animation workflow."
  - training_time: "LoRA training: ~30 minutes per character (1500 steps, 25 images, 11GB GPU). Generation estimate: Basic (12 scenes) ~15 min, Professional (24 scenes) ~30 min, Cinematic (48 scenes) ~60 min."
  - dependencies: "ai-toolkit required oyaml, torchaudio installation. Paths in configs must be absolute when running from ai-toolkit directory."
  - character_consistency: "Character LoRAs (25 images) provide strong consistency. Trigger words 'ohwx man' and 'ohwx woman' work well."
  - two_workflows: "Clarified two separate systems: (1) Animation workflow (SDXL + ControlNet, laptop-capable, 16 styles), (2) RunPod hybrid (WAN 2.6 + SkyReels, cloud-only, photorealistic)"

worked:
  - Manual caption generation for all images (simple 'ohwx man/woman' worked perfectly)
  - ai-toolkit training pipeline (after dependency fixes)
  - Absolute paths in YAML configs to avoid directory issues
  - 25 images per character provided good quality LoRAs
  - Sequential training approach (Rob first, then Michele)

failed:
  - Florence-2 auto-captioning (AttributeError with transformers library)
  - Initial relative paths in training configs (couldn't find datasets from ai-toolkit dir)
  - Multiple false starts due to missing dependencies (oyaml, torchaudio)

