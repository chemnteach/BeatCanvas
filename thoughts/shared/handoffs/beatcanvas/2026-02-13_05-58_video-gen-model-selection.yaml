runpod_workflow:
  architecture: "Models stored ON RunPod servers, NOT local laptop. Laptop sends API requests to RunPod endpoint, RunPod GPUs process and return results."
  storage_option: "Network Volume (persistent, $0.07/GB/month) - 100GB volume stores models (~42GB WAN + SkyReels). Models persist between pod stops/starts."

  setup_steps:
    - "Create RunPod account, add credits"
    - "Create 100GB network volume ($7/month)"
    - "Deploy A100 40GB pod with PyTorch template, attach network volume to /workspace"
    - "SSH into pod, clone BeatCanvas repo"
    - "Download models TO RunPod: WAN 2.6 (~14GB), SkyReels V2 DF (~28GB) using huggingface-cli"
    - "Start API server on pod: uvicorn main:app --host 0.0.0.0 --port 8000"
    - "Get RunPod proxy URL: https://abc123-8000.proxy.runpod.net"

  code_changes_needed:
    - "Create backend/src/cinematography/runpod_hybrid_generator.py - orchestrates WAN + SkyReels via RunPod endpoint"
    - "Update wan26_cloud_generator.py - point to RunPod endpoint instead of Replicate API"
    - "Create backend/src/cinematography/skyreels_df_generator.py - wrapper for SkyReels V2 DF stitching"
    - "Wire into main.py with USE_RUNPOD_HYBRID flag (feature toggle)"
    - "Add RunPod endpoint configuration to .env (RUNPOD_ENDPOINT_URL)"

  cost_breakdown:
    setup_one_time: "$1-2 (1-2hr pod time for model downloads)"
    network_volume: "$7/month (100GB persistent storage)"
    per_video: "$0.40 (20 min @ $1.19/hr on A100 40GB)"
    monthly_10_videos: "$11/month ($7 storage + 10 × $0.40)"

  local_vs_cloud:
    local_laptop: "12GB VRAM - runs only AnimateDiff-Lightning (lower quality)"
    runpod_pod: "Models stored in /workspace on RunPod. Laptop code sends HTTP requests to pod API endpoint. No model downloads to laptop."
    workflow: "Laptop → HTTP request → RunPod pod → GPU inference → HTTP response → Laptop receives video"

