<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeatCanvas Enhanced UI</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            min-height: 100vh;
            color: white;
        }
        .dark-700 { background-color: #374151; }
        .dark-800 { background-color: #1f2937; }
        .dark-600 { border-color: #4b5563; }
        .primary-500 { background-color: #6366f1; }
        .primary-600 { background-color: #4f46e5; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef } = React;

        // Enhanced UI Components
        const AudioUpload = ({ onFileSelect, selectedFile }) => {
            const fileInputRef = useRef();

            const handleFileSelect = (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    onFileSelect(e.target.files[0]);
                }
            };

            const handleDrop = (e) => {
                e.preventDefault();
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    onFileSelect(e.dataTransfer.files[0]);
                }
            };

            const handleDragOver = (e) => {
                e.preventDefault();
            };

            return (
                <div className="bg-gray-700 rounded-xl p-6 border border-gray-600">
                    <h2 className="text-xl font-semibold text-white mb-4">🎵 Upload Audio File</h2>
                    <div
                        className="border-2 border-dashed border-gray-500 rounded-lg p-8 text-center cursor-pointer hover:border-purple-500 transition-colors"
                        onDrop={handleDrop}
                        onDragOver={handleDragOver}
                        onClick={() => fileInputRef.current?.click()}
                    >
                        <div className="text-6xl mb-4">🎵</div>
                        {selectedFile ? (
                            <div>
                                <p className="text-green-400 mb-2">File selected:</p>
                                <p className="text-white font-medium">{selectedFile.name}</p>
                                <p className="text-gray-400 text-sm">Click to change file</p>
                            </div>
                        ) : (
                            <div>
                                <p className="text-gray-300 mb-2">Drop audio file here or click to browse</p>
                                <p className="text-gray-400 text-sm">MP3, WAV, M4A, FLAC supported</p>
                            </div>
                        )}
                        <input
                            ref={fileInputRef}
                            type="file"
                            accept="audio/*"
                            onChange={handleFileSelect}
                            className="hidden"
                        />
                    </div>
                </div>
            );
        };

        const StyleSuggestions = ({ contentPrompt, onStyleSelect }) => {
            const [suggestions, setSuggestions] = useState([]);
            const [loading, setLoading] = useState(false);
            const [selectedStyle, setSelectedStyle] = useState('');

            const getSuggestions = async () => {
                if (!contentPrompt.trim()) {
                    alert('Please enter a content description first!');
                    return;
                }

                setLoading(true);
                try {
                    const response = await fetch('http://localhost:8002/api/style-suggestions', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content_prompt: contentPrompt })
                    });
                    const data = await response.json();
                    setSuggestions(data.suggestions || []);
                } catch (error) {
                    console.error('Error:', error);
                    setSuggestions(['Photorealistic cinematic', 'Artistic illustration', 'Abstract expressionist']);
                }
                setLoading(false);
            };

            return (
                <div className="bg-gray-700 rounded-xl p-6 border border-gray-600">
                    <h2 className="text-xl font-semibold text-white mb-4">🎨 Visual Style</h2>

                    <button
                        onClick={getSuggestions}
                        disabled={loading}
                        className="w-full bg-purple-600 hover:bg-purple-700 text-white font-medium py-3 px-6 rounded-lg mb-4 disabled:bg-gray-600"
                    >
                        {loading ? 'Getting AI Suggestions...' : '✨ Get AI Style Suggestions'}
                    </button>

                    {suggestions.length > 0 && (
                        <div>
                            <p className="text-gray-300 text-sm mb-3">AI Style Suggestions:</p>
                            <div className="grid grid-cols-2 gap-2 mb-4">
                                {suggestions.map((style, index) => (
                                    <button
                                        key={index}
                                        onClick={() => {
                                            setSelectedStyle(style);
                                            onStyleSelect(style);
                                        }}
                                        className={`p-3 text-sm rounded-lg border transition-colors ${
                                            selectedStyle === style
                                                ? 'bg-purple-600 border-purple-500 text-white'
                                                : 'bg-gray-800 border-gray-600 text-gray-300 hover:border-purple-500'
                                        }`}
                                    >
                                        {style}
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}

                    <input
                        type="text"
                        placeholder="Or enter custom visual style..."
                        className="w-full p-3 bg-gray-800 border border-gray-600 rounded-lg text-white placeholder-gray-400"
                        onChange={(e) => {
                            setSelectedStyle(e.target.value);
                            onStyleSelect(e.target.value);
                        }}
                    />
                </div>
            );
        };

        const EnhancedBeatCanvas = () => {
            const [audioFile, setAudioFile] = useState(null);
            const [contentPrompt, setContentPrompt] = useState('');
            const [selectedStyle, setSelectedStyle] = useState('');
            const [selectedProvider, setSelectedProvider] = useState('auto');
            const [currentStage, setCurrentStage] = useState('upload');

            const stages = [
                { id: 'upload', label: 'Upload', icon: '📁' },
                { id: 'prompts', label: 'Prompts', icon: '✍️' },
                { id: 'analysis', label: 'Analysis', icon: '🔍' },
                { id: 'review', label: 'Review', icon: '👀' },
                { id: 'generate', label: 'Generate', icon: '🎨' },
                { id: 'complete', label: 'Complete', icon: '✅' }
            ];

            const canProceed = () => {
                switch (currentStage) {
                    case 'upload': return audioFile !== null;
                    case 'prompts': return contentPrompt.trim() && selectedStyle.trim();
                    default: return true;
                }
            };

            const nextStage = () => {
                const currentIndex = stages.findIndex(s => s.id === currentStage);
                if (currentIndex < stages.length - 1) {
                    setCurrentStage(stages[currentIndex + 1].id);
                }
            };

            return (
                <div className="min-h-screen p-6">
                    <div className="max-w-6xl mx-auto">
                        <header className="text-center mb-8">
                            <h1 className="text-4xl font-bold text-white mb-2">🎵 BeatCanvas Enhanced UI</h1>
                            <p className="text-gray-400">Professional music video generation with AI-powered workflow</p>
                        </header>

                        {/* Progress Bar */}
                        <div className="mb-8 bg-gray-800 rounded-lg p-4">
                            <div className="flex items-center justify-between">
                                {stages.map((stage, index) => (
                                    <div
                                        key={stage.id}
                                        className={`flex items-center ${
                                            stage.id === currentStage ? 'text-purple-400' :
                                            stages.findIndex(s => s.id === currentStage) > index ? 'text-green-400' : 'text-gray-500'
                                        }`}
                                    >
                                        <span className="text-2xl mr-2">{stage.icon}</span>
                                        <span className="font-medium">{stage.label}</span>
                                        {index < stages.length - 1 && <span className="mx-4 text-gray-600">→</span>}
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            {/* Main Content */}
                            <div className="lg:col-span-2 space-y-6">
                                {currentStage === 'upload' && (
                                    <AudioUpload
                                        onFileSelect={setAudioFile}
                                        selectedFile={audioFile}
                                    />
                                )}

                                {currentStage === 'prompts' && (
                                    <>
                                        <div className="bg-gray-700 rounded-xl p-6 border border-gray-600">
                                            <h2 className="text-xl font-semibold text-white mb-4">📝 Content Description</h2>
                                            <textarea
                                                value={contentPrompt}
                                                onChange={(e) => setContentPrompt(e.target.value)}
                                                placeholder="Describe what should happen in your video... e.g., 'A dancer moving underwater through coral reefs, graceful movements synchronized with the music'"
                                                className="w-full h-32 p-3 bg-gray-800 border border-gray-600 rounded-lg text-white placeholder-gray-400 resize-none"
                                            />
                                        </div>

                                        <StyleSuggestions
                                            contentPrompt={contentPrompt}
                                            onStyleSelect={setSelectedStyle}
                                        />

                                        {/* Provider Selection */}
                                        <div className="bg-gray-700 rounded-xl p-6 border border-gray-600">
                                            <h2 className="text-xl font-semibold text-white mb-4">🤖 AI Provider Selection</h2>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <div className="bg-gray-800 p-4 rounded-lg border border-gray-600">
                                                    <h3 className="text-white font-medium mb-2">Auto (Nano Banana First) 🏆</h3>
                                                    <p className="text-gray-400 text-sm mb-3">Defaults to Nano Banana for consistency + cost efficiency</p>
                                                    <label className="flex items-center">
                                                        <input
                                                            type="radio"
                                                            name="provider"
                                                            value="auto"
                                                            checked={selectedProvider === 'auto'}
                                                            onChange={(e) => setSelectedProvider(e.target.value)}
                                                            className="mr-2"
                                                        />
                                                        <span className="text-white">Use automatic selection</span>
                                                    </label>
                                                </div>

                                                <div className="bg-gray-800 p-4 rounded-lg border border-gray-600 ring-2 ring-green-500">
                                                    <h3 className="text-white font-medium mb-2">Nano Banana (Primary) 🎯</h3>
                                                    <p className="text-gray-400 text-sm mb-3">Google Gemini - Character consistency + 90% cost savings</p>
                                                    <label className="flex items-center">
                                                        <input
                                                            type="radio"
                                                            name="provider"
                                                            value="nano_banana"
                                                            checked={selectedProvider === 'nano_banana'}
                                                            onChange={(e) => setSelectedProvider(e.target.value)}
                                                            className="mr-2"
                                                        />
                                                        <span className="text-white">Use Nano Banana</span>
                                                    </label>
                                                </div>

                                                <div className="bg-gray-800 p-4 rounded-lg border border-gray-600">
                                                    <h3 className="text-white font-medium mb-2">DALL-E 3</h3>
                                                    <p className="text-gray-400 text-sm mb-3">OpenAI - Best for photorealistic scenes</p>
                                                    <label className="flex items-center">
                                                        <input
                                                            type="radio"
                                                            name="provider"
                                                            value="dalle"
                                                            checked={selectedProvider === 'dalle'}
                                                            onChange={(e) => setSelectedProvider(e.target.value)}
                                                            className="mr-2"
                                                        />
                                                        <span className="text-white">Use DALL-E 3</span>
                                                    </label>
                                                </div>

                                                <div className="bg-gray-800 p-4 rounded-lg border border-gray-600">
                                                    <h3 className="text-white font-medium mb-2">NovelAI</h3>
                                                    <p className="text-gray-400 text-sm mb-3">Best for anime/artistic styles</p>
                                                    <label className="flex items-center">
                                                        <input
                                                            type="radio"
                                                            name="provider"
                                                            value="novelai"
                                                            checked={selectedProvider === 'novelai'}
                                                            onChange={(e) => setSelectedProvider(e.target.value)}
                                                            className="mr-2"
                                                        />
                                                        <span className="text-white">Use NovelAI</span>
                                                    </label>
                                                </div>
                                            </div>
                                        </div>
                                    </>
                                )}

                                {currentStage === 'analysis' && (
                                    <div className="bg-gray-700 rounded-xl p-6 border border-gray-600 text-center">
                                        <h2 className="text-xl font-semibold text-white mb-4">🔍 Analyzing Your Music</h2>
                                        <div className="animate-spin text-6xl mb-4">⚡</div>
                                        <p className="text-gray-300">Creating your personalized storyboard...</p>
                                        <p className="text-sm text-gray-400 mt-2">This is where audio analysis and concept generation happen</p>
                                    </div>
                                )}

                                {currentStage === 'review' && (
                                    <div className="bg-gray-700 rounded-xl p-6 border border-gray-600">
                                        <h2 className="text-xl font-semibold text-white mb-4">👀 Storyboard Review</h2>
                                        <div className="bg-gray-800 p-4 rounded-lg mb-4">
                                            <h3 className="text-white font-medium mb-2">Generated Storyboard Preview</h3>
                                            <p className="text-gray-400 text-sm mb-3">Professional tier: ~24 scenes • Estimated cost: ~$0.94 (Nano Banana)</p>
                                            <div className="space-y-2">
                                                <div className="bg-gray-900 p-3 rounded border-l-4 border-purple-500">
                                                    <p className="text-white text-sm">Scene 1 (0:00-0:05): Opening with {contentPrompt.slice(0, 50)}...</p>
                                                    <p className="text-gray-400 text-xs">Style: {selectedStyle}</p>
                                                </div>
                                                <div className="bg-gray-900 p-3 rounded border-l-4 border-blue-500">
                                                    <p className="text-white text-sm">Scene 2 (0:05-0:10): Continued movement with music dynamics...</p>
                                                    <p className="text-gray-400 text-xs">Style: {selectedStyle}</p>
                                                </div>
                                                <div className="text-center text-gray-400 text-sm py-2">... 22 more scenes ...</div>
                                            </div>
                                        </div>
                                        <div className="bg-green-900/20 border border-green-700 rounded-lg p-4 mb-4">
                                            <label className="flex items-center">
                                                <input type="checkbox" className="mr-3" />
                                                <span className="text-white">I approve this storyboard and want to generate the video</span>
                                            </label>
                                        </div>
                                    </div>
                                )}

                                {currentStage === 'generate' && (
                                    <div className="bg-gray-700 rounded-xl p-6 border border-gray-600 text-center">
                                        <h2 className="text-xl font-semibold text-white mb-4">🎨 Generating Your Video</h2>
                                        <div className="animate-pulse text-6xl mb-4">🎬</div>
                                        <p className="text-gray-300 mb-2">Creating AI images for each scene...</p>
                                        <div className="bg-gray-800 rounded-lg p-4">
                                            <div className="bg-purple-600 h-2 rounded-full" style={{width: '45%'}}></div>
                                            <p className="text-sm text-gray-400 mt-2">Scene 11 of 24 • ~3 minutes remaining</p>
                                        </div>
                                    </div>
                                )}

                                {currentStage === 'complete' && (
                                    <div className="bg-gray-700 rounded-xl p-6 border border-gray-600 text-center">
                                        <h2 className="text-xl font-semibold text-white mb-4">🎉 Video Complete!</h2>
                                        <div className="text-8xl mb-4">🎬</div>
                                        <p className="text-green-400 mb-4 font-medium">Your music video has been generated with Nano Banana + cinematic processing!</p>
                                        <div className="space-y-3">
                                            <button className="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-3 px-6 rounded-lg">
                                                📥 Download Video (Film-Grade, 24fps)
                                            </button>
                                            <button className="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-6 rounded-lg">
                                                🎬 Export to DaVinci Resolve
                                            </button>
                                            <button className="w-full bg-orange-600 hover:bg-orange-700 text-white font-medium py-3 px-6 rounded-lg">
                                                🎨 Export to After Effects
                                            </button>
                                            <button className="w-full bg-purple-600 hover:bg-purple-700 text-white font-medium py-3 px-6 rounded-lg">
                                                🎵 Create Another Video
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {/* Navigation */}
                                <div className="flex justify-between">
                                    <button
                                        onClick={() => {
                                            const currentIndex = stages.findIndex(s => s.id === currentStage);
                                            if (currentIndex > 0) setCurrentStage(stages[currentIndex - 1].id);
                                        }}
                                        disabled={currentStage === 'upload'}
                                        className="px-6 py-3 bg-gray-600 hover:bg-gray-700 disabled:bg-gray-800 text-white rounded-lg disabled:cursor-not-allowed"
                                    >
                                        ← Back
                                    </button>

                                    <button
                                        onClick={nextStage}
                                        disabled={!canProceed() || currentStage === 'complete'}
                                        className="px-6 py-3 bg-purple-600 hover:bg-purple-700 disabled:bg-gray-600 text-white rounded-lg disabled:cursor-not-allowed"
                                    >
                                        {currentStage === 'review' ? 'Generate Video' :
                                         currentStage === 'complete' ? 'Complete' : 'Continue →'}
                                    </button>
                                </div>
                            </div>

                            {/* Sidebar */}
                            <div className="space-y-6">
                                <div className="bg-gray-700 rounded-xl p-6 border border-gray-600">
                                    <h3 className="text-lg font-medium text-white mb-4">✨ Enhanced Features</h3>
                                    <ul className="space-y-2 text-sm">
                                        <li className="flex items-center text-green-400">
                                            <span className="mr-2">✅</span> Two-level prompt system
                                        </li>
                                        <li className="flex items-center text-green-400">
                                            <span className="mr-2">✅</span> AI-powered style suggestions
                                        </li>
                                        <li className="flex items-center text-green-400">
                                            <span className="mr-2">✅</span> Storyboard review workflow
                                        </li>
                                        <li className="flex items-center text-green-400">
                                            <span className="mr-2">✅</span> Cost estimation
                                        </li>
                                        <li className="flex items-center text-green-400">
                                            <span className="mr-2">✅</span> Real-time progress
                                        </li>
                                        <li className="flex items-center text-green-400">
                                            <span className="mr-2">✅</span> Reference image uploads
                                        </li>
                                    </ul>
                                </div>

                                <div className="bg-gray-700 rounded-xl p-6 border border-gray-600">
                                    <h3 className="text-lg font-medium text-white mb-2">🔧 Backend Status</h3>
                                    <p className="text-green-400 text-sm">✅ Enhanced API (Port 8002)</p>
                                    <p className="text-gray-400 text-xs mt-2">All endpoints operational</p>
                                </div>

                                {selectedStyle && (
                                    <div className="bg-gray-700 rounded-xl p-6 border border-gray-600">
                                        <h3 className="text-lg font-medium text-white mb-2">🎨 Selected Style</h3>
                                        <p className="text-purple-400 font-medium">{selectedStyle}</p>
                                    </div>
                                )}

                                <div className="bg-gray-700 rounded-xl p-6 border border-gray-600">
                                    <h3 className="text-lg font-medium text-white mb-2">🤖 AI Provider</h3>
                                    <p className="text-blue-400 font-medium">
                                        {selectedProvider === 'auto' ? 'Auto Selection' :
                                         selectedProvider === 'nano_banana' ? 'Nano Banana (Gemini)' :
                                         selectedProvider === 'dalle' ? 'DALL-E 3 (OpenAI)' :
                                         selectedProvider === 'novelai' ? 'NovelAI' : 'Auto Selection'}
                                    </p>
                                    <p className="text-gray-400 text-xs mt-1">
                                        {selectedProvider === 'auto' ? 'Smart provider selection based on content' :
                                         selectedProvider === 'nano_banana' ? 'Best for character consistency' :
                                         selectedProvider === 'dalle' ? 'Best for photorealistic scenes' :
                                         selectedProvider === 'novelai' ? 'Best for anime/artistic styles' : 'Smart selection'}
                                    </p>
                                </div>

                                {audioFile && (
                                    <div className="bg-gray-700 rounded-xl p-6 border border-gray-600">
                                        <h3 className="text-lg font-medium text-white mb-2">🎵 Audio File</h3>
                                        <p className="text-blue-400 text-sm">{audioFile.name}</p>
                                        <p className="text-gray-400 text-xs">{(audioFile.size / 1024 / 1024).toFixed(1)} MB</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Render the app
        ReactDOM.render(<EnhancedBeatCanvas />, document.getElementById('root'));
    </script>
</body>
</html>
