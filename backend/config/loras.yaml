# --- BEATCANVAS LORA REGISTRY ---
# The LoRA Curator reads this file to match scenes to available LoRAs.
# To add a new LoRA, just add a block here. No coding required.
#
# Fields:
#   description  - What this LoRA does (shown to user in storyboard editor)
#   type         - style | scene | character | motion
#   triggers     - Keywords that match this LoRA to a scene prompt
#   file         - Path to .safetensors file (relative to output/loras/)
#   default_weight - Strength when applied (0.0-1.0)
#   enabled      - Set to true once the .safetensors file exists
#   source       - custom | civitai | huggingface (where it came from)
#   civitai_id   - CivitAI model ID (for auto-download)

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# GENERIC STYLE LORAS (work across many scenes)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

cinema:
  description: "Film-quality lighting, lens effects, depth of field"
  type: style
  triggers: ["dramatic", "epic", "movie", "widescreen", "anamorphic", "bokeh"]
  file: null
  default_weight: 0.8
  enabled: true
  source: generic

night:
  description: "Dark environments, neon lighting, urban night scenes"
  type: style
  triggers: ["night", "neon", "club", "concert", "cyberpunk", "rain", "dark"]
  file: null
  default_weight: 0.7
  enabled: true
  source: generic

detail:
  description: "Extreme detail, skin texture, fabric weave, close-ups"
  type: style
  triggers: ["close-up", "portrait", "texture", "detail", "macro", "realism"]
  file: null
  default_weight: 0.6
  enabled: true
  source: generic

