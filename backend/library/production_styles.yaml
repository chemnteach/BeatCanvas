# ═══════════════════════════════════════════════════════════════════════════════
# PRODUCTION STYLES REGISTRY - Unfiltered Edge Case Specializations
# ═══════════════════════════════════════════════════════════════════════════════
#
# RAW. VISCERAL. UNCOMPROMISED.
#
# These styles capture the authentic aesthetics of:
# - Street violence and hood culture
# - Punk rock anarchy and mosh pit chaos
# - Explicit anatomical interaction
#
# VRAM CONTRACT: All styles must kill() cleanly to <1GB baseline.
# Deep Purge: unload_lora_weights() + torch.cuda.empty_cache()
# ═══════════════════════════════════════════════════════════════════════════════

version: "2.0"
description: "Unfiltered production styles - raw street aesthetic"

# ═══════════════════════════════════════════════════════════════════════════════
# STYLE: HARD ACTION - Raw Street Violence
# ═══════════════════════════════════════════════════════════════════════════════
# Use Case: Hood violence, gunfights, trap aesthetic
# Base Model: RealVisXL (photorealistic grit)
# ═══════════════════════════════════════════════════════════════════════════════

STYLE_HARD_ACTION:
  display_name: "Hard Action - Street Beef"
  description: "Raw hood violence, gunfight chaos, visceral documentary grit"

  base_models:
    - realvis       # Photorealistic street aesthetic
    - juggernaut    # Alternative realism

  loras:
    - name: "cinematic_grit_v1"
      path: "loras/cinematic_grit_v1.safetensors"
      weight: 1.4
      trigger: "gritty, raw, documentary, handheld"
      critical: true

  # UNFILTERED PROMPT INJECTION
  prompt_prefix: >-
    (raw street beef:1.3), (gunfight:1.4), visceral bloody splatter,
    muzzle flash, handheld documentary footage, (hood violence:1.2),
    gritty trap aesthetic,

  prompt_suffix: ", 35mm film grain, high contrast shadows, raw intensity"

  negative_prompt: >-
    (sanitized:1.4), clean, cinematic lighting, 3d render, plastic skin,
    safe, professional photography, studio lighting, polished,
    corporate, family-friendly, censored

  generation:
    cfg_scale: 8.0
    steps: 30
    sampler: "DPM++ 2M Karras"
    clip_skip: 2

  vram:
    estimated_gb: 5.5
    priority: "high"
    cleanup_aggressive: true
    deep_purge: true


