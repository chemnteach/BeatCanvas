# ═══════════════════════════════════════════════════════════════════════════════
# VRAM SAFETY RULES - Deep Purge Protocol
# ═══════════════════════════════════════════════════════════════════════════════

vram_safety:
  # Maximum LoRAs loaded simultaneously
  max_lora_stack: 4

  # Baseline after kill() - MUST return to this
  baseline_gb: 1.0

  # If VRAM > this after kill(), ABORT - contamination detected
  emergency_threshold_gb: 1.5

  # Deep Purge sequence (executed on every style transition)
  deep_purge_sequence:
    - "pipe.unload_lora_weights()"
    - "del pipe"
    - "gc.collect()"
    - "gc.collect()"
    - "gc.collect()"
    - "torch.cuda.empty_cache()"
    - "torch.cuda.synchronize()"

  # Styles requiring full VRAM isolation
  isolated_styles:
    - STYLE_INTENSE_INTERACTION

  # Transition rules
  transitions:
    # After explicit content, ALWAYS deep purge
    from_intense_interaction:
      cleanup: "deep_purge"
      verify_baseline: true
      gc_cycles: 3
      abort_on_contamination: true

    # Violence styles need cleanup but less strict
    from_hard_action:
      cleanup: "aggressive"
      verify_baseline: true

    # Urban to other is safe
    from_urban_grit:
      cleanup: "normal"
      verify_baseline: false


